name: Postavi proveru notesa (Cloudflare Worker)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["provera/**", ".github/workflows/provera.yml"]

jobs:
  postavi:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
    defaults:
      run:
        working-directory: provera
    steps:
      - uses: actions/checkout@v4

      - name: Proveri da postoji GitHub token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Nedostaje tajna GH_DISPATCH_TOKEN (GitHub token sa dozvolom Actions: Read and write)."
            exit 1
          fi

      - name: Objavi Worker na Cloudflare
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4 deploy 2>&1 | tee ../objava.log; then
            echo "Objava sa workers.dev adresom nije uspela, pokušavam bez nje."
            sed -i 's/^workers_dev = true/workers_dev = false/' wrangler.toml
            if ! npx --yes wrangler@4 deploy; then
              echo "::error::Cloudflare je odbio objavu Worker-a. Cloudflare API tokenu (CLOUDFLARE_API_TOKEN) dodaj dozvolu Account → Workers Scripts → Edit."
              exit 1
            fi
          fi

      - name: Sačuvaj GitHub token u Worker-u
        run: printf '%s' "$GH_TOKEN" | npx --yes wrangler@4 secret put GH_TOKEN

      - name: Proba Worker-a (isto što radi na svakih 10 minuta)
        run: |
          adresa=$(grep -o 'https://[a-z0-9.-]*workers\.dev' ../objava.log | head -1 || true)
          if [ -z "$adresa" ]; then echo "Worker nema javnu adresu, proba preskočena."; exit 0; fi
          sleep 15
          echo "Odgovor Worker-a:"
          odgovor=$(curl -sS --max-time 60 "$adresa")
          echo "$odgovor"
          case "$odgovor" in GREŠKA*) echo "::error::$odgovor"; exit 1;; esac
